<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <title>Jadwal Piket</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .stat-card {
            border-radius: 15px;
            padding: 15px;
            background: white;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        }

        #calendar {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, .1);
        }
    </style>

</head>

<body>

    <div class="container py-4">

        <h1 class="text-center mb-4">
            📅 Jadwal Piket
        </h1>

        <div class="row mb-4">

            <div class="col">
                <div class="stat-card text-center">
                    <h5>Yusuf</h5>
                    <span id="yusuf">0</span>x
                </div>
            </div>

            <div class="col">
                <div class="stat-card text-center">
                    <h5>Laila</h5>
                    <span id="laila">0</span>x
                </div>
            </div>

            <div class="col">
                <div class="stat-card text-center">
                    <h5>Khana</h5>
                    <span id="khana">0</span>x
                </div>
            </div>

            <div class="col">
                <div class="stat-card text-center">
                    <h5>Anggun</h5>
                    <span id="anggun">0</span>x
                </div>
            </div>

            <div class="col">
                <div class="stat-card text-center">
                    <h5>Hendri</h5>
                    <span id="hendri">0</span>x
                </div>
            </div>

        </div>

        <div id="calendar"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

    <script>

        const API =
            "PASTE_URL_APPS_SCRIPT_DISINI";

        fetch(API)
            .then(r => r.json())
            .then(data => {

                let events = [];

                let statistik = {
                    Yusuf: 0,
                    Laila: 0,
                    Khana: 0,
                    Anggun: 0,
                    Hendri: 0
                };

                data.forEach(item => {

                    let nama = '';

                    if (item.petugas1) {
                        nama += item.petugas1;
                        statistik[item.petugas1]++;
                    }

                    if (item.petugas2) {
                        nama += ' & ' + item.petugas2;
                        statistik[item.petugas2]++;
                    }

                    if (item.status === "Libur") {
                        nama = "🔴 LIBUR";
                    }

                    events.push({

                        title: nama,

                        start: item.tanggal,

                        allDay: true

                    });

                });

                document.getElementById("yusuf").innerText =
                    statistik.Yusuf;

                document.getElementById("laila").innerText =
                    statistik.Laila;

                document.getElementById("khana").innerText =
                    statistik.Khana;

                document.getElementById("anggun").innerText =
                    statistik.Anggun;

                document.getElementById("hendri").innerText =
                    statistik.Hendri;

                let calendarEl =
                    document.getElementById('calendar');

                let calendar =
                    new FullCalendar.Calendar(calendarEl, {

                        initialView: 'dayGridMonth',

                        locale: 'id',

                        events: events

                    });

                calendar.render();

            });

    </script>

</body>

</html>
