<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Jadwal Piket BUMDes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.header-card{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.stat-card{
    background:white;
    border-radius:15px;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.stat-card h3{
    margin:0;
    font-weight:bold;
    color:#198754;
}

.table-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.badge-petugas{
    background:#198754;
    color:white;
    padding:6px 10px;
    border-radius:20px;
    font-size:.85rem;
    margin-right:4px;
}

</style>

</head>

<body>

<div class="container py-4">

    <div class="header-card mb-4">

        <h2 class="mb-2">
            📅 Jadwal Piket BUMDes
        </h2>

        <p class="text-muted mb-0">
            Informasi jadwal piket dan pembagian tugas anggota.
        </p>

    </div>

    <!-- Statistik -->

    <div class="row g-3 mb-4">

        <div class="col-md">
            <div class="stat-card">
                <h6>Yusuf</h6>
                <h3 id="statYusuf">0</h3>
                <small>Total Piket</small>
            </div>
        </div>

        <div class="col-md">
            <div class="stat-card">
                <h6>Laila</h6>
                <h3 id="statLaila">0</h3>
                <small>Total Piket</small>
            </div>
        </div>

        <div class="col-md">
            <div class="stat-card">
                <h6>Khana</h6>
                <h3 id="statKhana">0</h3>
                <small>Total Piket</small>
            </div>
        </div>

        <div class="col-md">
            <div class="stat-card">
                <h6>Anggun</h6>
                <h3 id="statAnggun">0</h3>
                <small>Total Piket</small>
            </div>
        </div>

        <div class="col-md">
            <div class="stat-card">
                <h6>Hendri</h6>
                <h3 id="statHendri">0</h3>
                <small>Total Piket</small>
            </div>
        </div>

    </div>

    <!-- Jadwal -->

    <div class="table-card">

        <div class="p-3 bg-success text-white">
            <h5 class="mb-0">
                📋 Daftar Jadwal Piket
            </h5>
        </div>

        <div class="table-responsive">

            <table class="table table-bordered mb-0">

                <thead class="table-light">

                    <tr>
                        <th width="180">Tanggal</th>
                        <th>Petugas</th>
                    </tr>

                </thead>

                <tbody id="tbody"></tbody>

            </table>

        </div>

    </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzHL2u3aI2L_tpjL7PrPJJGnKQavSoWQptKv0j5B6jE3CrJX4Al3M4t0d71Ze_1ibM9KQ/exec";

loadData();

async function loadData(){

    const res = await fetch(API);
    const data = await res.json();

    tbody.innerHTML = "";

    let stats = {
        Yusuf:0,
        Laila:0,
        Khana:0,
        Anggun:0,
        Hendri:0
    };

    data.sort((a,b)=>
        new Date(a.tanggal) - new Date(b.tanggal)
    );

    data.forEach(item=>{

        if(item.petugas1 && stats[item.petugas1] !== undefined)
            stats[item.petugas1]++;

        if(item.petugas2 && stats[item.petugas2] !== undefined)
            stats[item.petugas2]++;

        tbody.innerHTML += `
        <tr>

            <td>
                ${item.tanggal}
            </td>

            <td>

                <span class="badge-petugas">
                    ${item.petugas1}
                </span>

                ${
                    item.petugas2
                    ?
                    `<span class="badge-petugas">${item.petugas2}</span>`
                    :
                    ''
                }

            </td>

        </tr>
        `;
    });

    statYusuf.innerText = stats.Yusuf;
    statLaila.innerText = stats.Laila;
    statKhana.innerText = stats.Khana;
    statAnggun.innerText = stats.Anggun;
    statHendri.innerText = stats.Hendri;

}

</script>

</body>
</html>
