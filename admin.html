<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kelola Jadwal Piket BUMDes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.card{
    border:none;
    border-radius:15px;
}

.table{
    background:white;
}

.stat-card{
    background:white;
    padding:15px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<div class="container py-4">

    <h2 class="mb-1">
        ⚙️ Kelola Jadwal Piket
    </h2>

    <p class="text-muted mb-4">
        Tambahkan, edit, atau hapus jadwal piket anggota.
    </p>

    <!-- Statistik -->

    <div class="row mb-4">

        <div class="col-md">
            <div class="stat-card">
                <h6>Yusuf</h6>
                <h3 id="statYusuf">0</h3>
            </div>
        </div>

        <div class="col-md">
            <div class="stat-card">
                <h6>Laila</h6>
                <h3 id="statLaila">0</h3>
            </div>
        </div>

        <div class="col-md">
            <div class="stat-card">
                <h6>Khana</h6>
                <h3 id="statKhana">0</h3>
            </div>
        </div>

        <div class="col-md">
            <div class="stat-card">
                <h6>Anggun</h6>
                <h3 id="statAnggun">0</h3>
            </div>
        </div>

        <div class="col-md">
            <div class="stat-card">
                <h6>Hendri</h6>
                <h3 id="statHendri">0</h3>
            </div>
        </div>

        <div class="col-md">
            <div class="stat-card">
                <h6>Uswatun</h6>
                <h3 id="statUswatun">0</h3>
            </div>
        </div>

    </div>

    <!-- Form -->

    <div class="card shadow-sm mb-4">

        <div class="card-header">
            <h5 class="mb-0">📝 Form Jadwal Piket</h5>
        </div>

        <div class="card-body">

            <form id="form">

                <input type="hidden" id="row">

                <div class="row g-3">

                    <div class="col-md-3">

                        <label class="form-label">
                            📅 Tanggal
                        </label>

                        <input
                            type="date"
                            id="tanggal"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-2">

                        <label class="form-label">
                            👤 Petugas 1
                        </label>

                        <select
                            id="petugas1"
                            class="form-select">

                            <option value="">Kosong</option>
                            <option>Yusuf</option>
                            <option>Laila</option>
                            <option>Khana</option>
                            <option>Anggun</option>
                            <option>Hendri</option>
                            <option>Uswatun</option>

                        </select>

                    </div>

                    <div class="col-md-2">

                        <label class="form-label">
                            👥 Petugas 2
                        </label>

                        <select
                            id="petugas2"
                            class="form-select">

                            <option value="">Kosong</option>
                            <option>Yusuf</option>
                            <option>Laila</option>
                            <option>Khana</option>
                            <option>Anggun</option>
                            <option>Hendri</option>
                            <option>Uswatun</option>

                        </select>

                    </div>

                    <div class="col-md-3 d-flex align-items-end">

                        <button class="btn btn-success w-100">
                            💾 Simpan Jadwal
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <!-- Tabel -->

    <div class="card shadow-sm">

        <div class="card-header">
            <h5 class="mb-0">📋 Daftar Jadwal</h5>
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered align-middle">

                    <thead class="table-dark">

                        <tr>
                            <th>Tanggal</th>
                            <th>Petugas</th>
                            <th width="180">Aksi</th>
                        </tr>

                    </thead>

                    <tbody id="tbody"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzHL2u3aI2L_tpjL7PrPJJGnKQavSoWQptKv0j5B6jE3CrJX4Al3M4t0d71Ze_1ibM9KQ/exec";

loadData();

async function loadData(){

    const res = await fetch(API);
    const data = await res.json();

    tbody.innerHTML='';

    let stats = {
        Yusuf:0,
        Laila:0,
        Khana:0,
        Anggun:0,
        Hendri:0,
        Uswatun:0
        
    };

    data.forEach(item=>{

        if(item.petugas1 && stats[item.petugas1] !== undefined)
            stats[item.petugas1]++;

        if(item.petugas2 && stats[item.petugas2] !== undefined)
            stats[item.petugas2]++;

        tbody.innerHTML += `
        <tr>

            <td>${item.tanggal}</td>

            <td>
                ${item.petugas1}
                ${item.petugas2 ? ' & ' + item.petugas2 : ''}
            </td>

            <td>
            
                <button
                class="btn btn-danger btn-sm"
                onclick='hapus(${item.row})'>
                Hapus
                </button>

            </td>

        </tr>
        `;
    });

    statYusuf.innerText = stats.Yusuf;
    statLaila.innerText = stats.Laila;
    statKhana.innerText = stats.Khana;
    statAnggun.innerText = stats.Anggun;
    statHendri.innerText = stats.Hendri;
    statUswatun.innerText = stats.Uswatun;
    
}

function editData(item){

    row.value = item.row;
    tanggal.value = item.tanggal;
    petugas1.value = item.petugas1;
    petugas2.value = item.petugas2;

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });
}

async function hapus(rowNumber){

    if(!confirm("Yakin hapus jadwal ini?"))
        return;

    await fetch(API,{
        method:"POST",
        body:JSON.stringify({
            action:"delete",
            row:rowNumber
        })
    });

    loadData();
}

form.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const action =
        row.value ? "update" : "add";

    await fetch(API,{
        method:"POST",
        body:JSON.stringify({

            action,

            row:row.value,

            tanggal:tanggal.value,

            petugas1:petugas1.value,

            petugas2:petugas2.value,

        })
    });

    form.reset();
    row.value='';

    loadData();

});

</script>

</body>
</html>
