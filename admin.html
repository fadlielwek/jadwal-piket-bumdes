<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Tambah Jadwal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container py-5">

        <h2 class="mb-4">
            Tambah Jadwal
        </h2>

        <form id="form">

            <div class="mb-3">
                <label>Tanggal</label>
                <input type="date" class="form-control" id="tanggal">
            </div>

            <div class="mb-3">

                <label>Petugas 1</label>

                <select id="petugas1" class="form-select">

                    <option>Yusuf</option>
                    <option>Laila</option>
                    <option>Khana</option>
                    <option>Anggun</option>
                    <option>Hendri</option>

                </select>

            </div>

            <div class="mb-3">

                <label>Petugas 2</label>

                <select id="petugas2" class="form-select">

                    <option value="">Kosong</option>
                    <option>Yusuf</option>
                    <option>Laila</option>
                    <option>Khana</option>
                    <option>Anggun</option>
                    <option>Hendri</option>

                </select>

            </div>

            <div class="mb-3">

                <label>Status</label>

                <select id="status" class="form-select">

                    <option>Piket</option>
                    <option>Libur</option>

                </select>

            </div>

            <button class="btn btn-primary">
                Simpan
            </button>

        </form>

    </div>

    <script>

        const API =
            "PASTE_URL_APPS_SCRIPT_DISINI";

        document
            .getElementById("form")
            .addEventListener("submit",
                async (e) => {

                    e.preventDefault();

                    await fetch(API, {

                        method: "POST",

                        body: JSON.stringify({

                            tanggal:
                                tanggal.value,

                            petugas1:
                                petugas1.value,

                            petugas2:
                                petugas2.value,

                            status:
                                status.value

                        })

                    });

                    alert("Berhasil disimpan");

                    location.reload();

                });

    </script>

</body>

</html>
