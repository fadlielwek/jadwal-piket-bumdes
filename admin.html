<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Jadwal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-4">

<h2 class="mb-4">
⚙️ Kelola Jadwal Piket
</h2>

<form id="form">

<input type="hidden" id="row">

<div class="row">

<div class="col-md-3">
<input type="date"
id="tanggal"
class="form-control"
required>
</div>

<div class="col-md-2">

<select id="petugas1"
class="form-select">

<option>Yusuf</option>
<option>Laila</option>
<option>Khana</option>
<option>Anggun</option>
<option>Hendri</option>

</select>

</div>

<div class="col-md-2">

<select id="petugas2"
class="form-select">

<option value="">Kosong</option>
<option>Yusuf</option>
<option>Laila</option>
<option>Khana</option>
<option>Anggun</option>
<option>Hendri</option>

</select>

</div>

<div class="col-md-2">

<select id="status"
class="form-select">

<option>Piket</option>
<option>Libur</option>
<option>Kosong</option>

</select>

</div>

<div class="col-md-3">

<button class="btn btn-success">
💾 Simpan
</button>

</div>

</div>

</form>

<hr>

<table class="table table-bordered">

<thead>

<tr>
<th>Tanggal</th>
<th>Petugas</th>
<th>Status</th>
<th>Aksi</th>
</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzHL2u3aI2L_tpjL7PrPJJGnKQavSoWQptKv0j5B6jE3CrJX4Al3M4t0d71Ze_1ibM9KQ/exec";

loadData();

async function loadData(){

const res = await fetch(API);
const data = await res.json();

tbody.innerHTML='';

data.forEach(item=>{

tbody.innerHTML += `
<tr>

<td>${item.tanggal}</td>

<td>
${item.petugas1}
${item.petugas2 ? ' & '+item.petugas2:''}
</td>

<td>${item.status}</td>

<td>

<button
class="btn btn-warning btn-sm"
onclick='editData(${JSON.stringify(item)})'>
Edit
</button>

<button
class="btn btn-danger btn-sm"
onclick='hapus(${item.row})'>
Hapus
</button>

</td>

</tr>
`;

});

}

function editData(item){

row.value=item.row;
tanggal.value=item.tanggal;
petugas1.value=item.petugas1;
petugas2.value=item.petugas2;
status.value=item.status;

}

async function hapus(rowNumber){

if(!confirm("Hapus data?"))
return;

await fetch(API,{

method:"POST",

body:JSON.stringify({

action:"delete",

row:rowNumber

})

});

loadData();

}

form.addEventListener("submit",async(e)=>{

e.preventDefault();

const action =
row.value ? "update":"add";

await fetch(API,{

method:"POST",

body:JSON.stringify({

action,

row:row.value,

tanggal:tanggal.value,

petugas1:petugas1.value,

petugas2:petugas2.value,

status:status.value

})

});

form.reset();
row.value='';

loadData();

});

</script>

</body>
</html>
